function stepText(p){
  const A=p.pins[0], B=p.pins[1];
  switch(p.t){
    case 'wire': return `Cable ${p.color||''}: inserta un extremo en ${A} y el otro en ${B}.`;
    case 'res': return `Resistencia ${p.label}: una pata en ${A} y la otra en ${B}. No tiene polaridad.`;
    case 'ccap': return `Condensador ${p.label}: una pata en ${A} y la otra en ${B}. Sin polaridad.`;
    case 'tvs': return `Diodo TVS ${p.label}: sin polaridad (bidireccional). Patas en ${A} y ${B}.`;
    case 'xtal': return `Cristal ${p.label}: patas en ${A} y ${B}. Sin polaridad.`;
    case 'ecap': return `Electrolítico ${p.label}: pata POSITIVA (larga) en ${A}; pata NEGATIVA (lado de la franja) en ${B}.`;
    case 'diode': return `Diodo ${p.label}: ÁNODO en ${A}; CÁTODO (extremo con la banda) en ${B}.`;
    case 'zener': return `Zener ${p.label}: CÁTODO (banda) en ${A}; ÁNODO en ${B}.`;
    case 'led': return `LED ${p.label}: ÁNODO (pata larga) en ${A}; CÁTODO (pata corta, borde plano) en ${B}.`;
    case 'dip8': case 'dip14': case 'dip28': return `${p.label}: a horcajadas del canal central, muesca/punto del pin 1 hacia la fila menor. Pin 1 en ${A}; los pines suben por la columna E y bajan por la F.`;
    case 'to220': return `${p.label}: tres patas en filas consecutivas (${p.pins.join(', ')}), cara metálica hacia el borde de la placa.`;
    case 'to220_5': return `${p.label}: soldar antes a un adaptador de 5 pines paso 2.54 mm. Patas en ${p.pins.join(', ')}.`;
    case 'sip3': return `${p.label}: tres pines en línea, en ${p.pins.join(', ')}.`;
    case 'pot': case 'trim': return `${p.label}: patas en ${p.pins.join(', ')} (la central es el cursor).`;
    case 'term': return `${p.label}: pines en ${p.pins.join(', ')}; los tornillos miran hacia el borde de la placa.`;
  }
  return p.label;
}
function pinRows(p){ const nets=Array.isArray(p.net)?p.net:p.pins.map(()=>p.net); return p.pins.map((h,i)=>({hole:h,name:p.pinNames[i]||('pin '+(i+1)),net:nets[i]})); }
function holeGroup(h){ const m=/^([A-J]|[TB][+-])(\d+)$/.exec(h); if(!m) return ''; const c=m[1]; if(c.length===2) return 'riel '+c+' (todo el riel es la misma red)'; return (c<='E'?'grupo A–E':'grupo F–J')+' de la fila '+m[2]+' (5 huecos unidos)'; }

const $=id=>document.getElementById(id); const sheetsEl=[...document.querySelectorAll('.sh')]; let curSheet='h1', stepMode=false, cur=0, zoom=100;
function showSheet(id){ curSheet=id; sheetsEl.forEach(s=>s.classList.toggle('show', id==='all' || s.id==='wrap-'+id)); document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.sheet===id)); }
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>showSheet(t.dataset.sheet)));
function elemsFor(id){ const out=[...document.querySelectorAll(`[data-part="${id}"]`)]; document.querySelectorAll('[data-parts]').forEach(e=>{ if(e.dataset.parts.split(' ').includes(id)) out.push(e); }); return out; }
const ELEMS=PB_PARTS.map(p=>elemsFor(p.id));
function sheetOf(i){ const c={}; ELEMS[i].forEach(e=>{ const s=e.closest('.sh'); if(s) c[s.id]=(c[s.id]||0)+1; }); let best=null,n=0; for(const k in c) if(c[k]>n){n=c[k];best=k;} return best?best.replace('wrap-',''):null; }
function render(){
  document.querySelectorAll('.hl,.done').forEach(e=>e.classList.remove('hl','done'));
  document.querySelectorAll('svg.sheet').forEach(s=>s.classList.toggle('stepmode',stepMode));
  $('bStep').classList.toggle('on',stepMode); $('card').style.display=stepMode?'block':'none';
  [...$('list').children].forEach(e=>{ if(e.classList.contains('it')){ const i=+e.dataset.i; e.classList.toggle('cur',stepMode&&i===cur); e.classList.toggle('done',stepMode&&i<cur); } });
  if(!stepMode){ $('counter').textContent='—'; return; }
  for(let i=0;i<cur;i++) ELEMS[i].forEach(e=>e.classList.add('done'));
  ELEMS[cur].forEach(e=>e.classList.add('hl'));
  const p=PB_PARTS[cur]; const sh=sheetOf(cur); if(sh && curSheet!=='all') showSheet(sh);
  $('counter').textContent=`Paso ${cur+1} / ${PB_PARTS.length}`;
  const rows=pinRows(p).map(r=>`<tr><td><span class="hole">${r.hole}</span></td><td>${r.name}</td><td>${r.net}</td><td>${holeGroup(r.hole)}</td></tr>`).join('');
  $('card').innerHTML=`<div class="t">Paso ${cur+1} · ${p.id} — ${p.label}</div><div style="color:#94a3b8;font-size:12px">Fase ${p.fase} · ${TIPO[p.t]||p.t}${sh?' · aparece en '+document.getElementById('wrap-'+sh).dataset.title.split(' · ')[0]:' · <span class=warn>puente solo de protoboard (no aparece en el esquemático)</span>'}</div><div class="ins">${stepText(p)}</div>${p.nota?'<div class="warn">⚠ '+p.nota+'</div>':''}<table><tr><th>Hueco</th><th>Pata / pin</th><th>Red eléctrica</th><th>Huecos unidos</th></tr>${rows}</table>`;
  $('b3d').href='diagrama_conexion_3d_paso_a_paso.html#paso='+(cur+1); location.hash='paso='+(cur+1);
  const it=$('list').querySelector('.it.cur'); if(it) it.scrollIntoView({block:'nearest'});
}
function setStep(i){ cur=Math.max(0,Math.min(PB_PARTS.length-1,i)); stepMode=true; render(); }
$('bStep').addEventListener('click',()=>{ stepMode=!stepMode; render(); }); $('bPrev').addEventListener('click',()=>setStep(cur-1)); $('bNext').addEventListener('click',()=>setStep(cur+1));
$('bZoomIn').addEventListener('click',()=>{ zoom=Math.min(300,zoom+25); sheetsEl.forEach(s=>s.style.width=zoom+'%'); }); $('bZoomOut').addEventListener('click',()=>{ zoom=Math.max(50,zoom-25); sheetsEl.forEach(s=>s.style.width=zoom+'%'); });
window.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){setStep(cur+1);} if(e.key==='ArrowLeft'){setStep(cur-1);} });
// lista lateral
let ph=null; const list=$('list'); PB_PARTS.forEach((p,i)=>{ if(p.fase!==ph){ ph=p.fase; const h=document.createElement('div'); h.className='ph'; h.textContent='Fase '+ph; list.appendChild(h); } const d=document.createElement('div'); d.className='it'; d.dataset.i=i; d.dataset.k=(p.id+' '+p.label+' '+p.pins.join(' ')+' '+(p.color||'')).toLowerCase(); d.innerHTML=`<span class="n">${i+1}</span><b>${p.id}</b> ${p.label.split(' (')[0]}<br><span>${p.pins.join(' → ')}</span>`; d.addEventListener('click',()=>setStep(i)); list.appendChild(d); });
$('search').addEventListener('input',e=>{ const q=e.target.value.toLowerCase().trim(); [...list.children].forEach(el=>{ if(el.classList.contains('it')) el.style.display=(!q||el.dataset.k.includes(q))?'':'none'; }); });
// hoja en la que está cada parte, al hacer clic en el esquemático
document.querySelectorAll('[data-part]').forEach(e=>e.addEventListener('click',()=>{ const i=PB_PARTS.findIndex(p=>p.id===e.dataset.part); if(i>=0) setStep(i); }));
const m=/paso=(\d+)/.exec(location.hash); showSheet('h1'); if(m) setStep(+m[1]-1); else render();
</script></body></html>
